name: Sync matches

# Pinguje endpoint /api/cron/sync-matches na produkcji co 5 minut.
# Pobiera wyniki z football-data.org i upsertuje w Supabase.
#
# Wymagane GitHub Secrets (Settings → Secrets and variables → Actions):
#   APP_URL       — np. https://mundial2026.vercel.app  (bez końcowego slasha)
#   CRON_SECRET   — ta sama wartość co w env Vercela

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # pozwala odpalić ręcznie z zakładki Actions

concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Brak APP_URL lub CRON_SECRET w GitHub Secrets"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sync-matches")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
